name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint-md:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Lint markdown
        run: uvx rumdl@0.2.78 check .
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
      plugins: ${{ steps.list.outputs.plugins }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: list
        run: |
          {
            echo -n 'packages=['
            sep=''
            for p in core/*/pyproject.toml plugins/*/pyproject.toml; do
              if [ -e "$p" ]; then
                echo -n "$sep\"$(dirname "$p")\""
                sep=','
              fi
            done
            echo ']'
          } >> "$GITHUB_OUTPUT"
          {
            echo -n 'plugins=['
            sep=''
            for d in plugins/*/Dockerfile; do
              if [ -e "$d" ]; then
                echo -n "$sep\"$(dirname "$d")\""
                sep=','
              fi
            done
            echo ']'
          } >> "$GITHUB_OUTPUT"
  check:
    needs: discover
    # A matrix over an empty list fails the job, so the job is skipped
    # while no package exists.
    if: needs.discover.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      # uv installs the tool outside the job's PATH, and GITHUB_PATH takes
      # effect only in later steps, so poe --version runs as its own step.
      - name: Install the task runner
        run: |
          uv tool install poethepoet==0.48.0
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Confirm the task runner is on the path
        run: poe --version
      - name: Lint
        working-directory: ${{ matrix.package }}
        run: poe lint
      - name: Test
        working-directory: ${{ matrix.package }}
        run: poe test
  manifest-check:
    needs: discover
    if: needs.discover.outputs.plugins != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJSON(needs.discover.outputs.plugins) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.12"
      - name: Build the plugin image
        run: docker build -t apx-plugin:ci ${{ matrix.plugin }}
      - name: Check the manifest
        working-directory: core/agent-proxy
        run: uv run agent-proxy manifest check apx-plugin:ci
  images:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:3@sha256:ddf754342cfc8acc51a56d5d0ab6af06826461864460636d8bd5c546dab2a7b8
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the images and push them to the job's registry
        run: >-
          core/docker/build-images.sh 0.0.0 localhost:5000/gravital-forge
          "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" > "$RUNNER_TEMP/references"
      - name: Check that the instance image carries the verifier's digest reference
        run: |
          verifier="$(head -n 1 "$RUNNER_TEMP/references")"
          environment="$(docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' localhost:5000/gravital-forge/agent-proxy:0.0.0)"
          if ! grep --quiet --line-regexp --fixed-strings "AGENT_PROXY_VERIFIER_IMAGE=$verifier" <<< "$environment"; then
            echo "the instance image does not hold AGENT_PROXY_VERIFIER_IMAGE=$verifier" >&2
            exit 1
          fi
