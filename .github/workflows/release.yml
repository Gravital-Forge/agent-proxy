name: release
on:
  release:
    types: [published]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Refuse a tag that is not v<major>.<minor>.<patch>
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "the release tag must be v<major>.<minor>.<patch>, got '$TAG'" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR
        env:
          REGISTRY_PASSWORD: ${{ github.token }}
        run: >-
          docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          <<< "$REGISTRY_PASSWORD"
      - name: Build the images and push them to GHCR
        run: >-
          core/docker/build-images.sh "${TAG#v}" ghcr.io/gravital-forge
          "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" > "$RUNNER_TEMP/references"
      - name: Write the image references into the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body | sed '/^## Images\r\?$/,$d')"
          {
            printf '%s\n\n## Images\n\n' "$body"
            while IFS= read -r reference; do
              printf -- "- \`%s\`\n" "$reference"
            done < "$RUNNER_TEMP/references"
          } > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
